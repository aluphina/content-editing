<title>Наша евротрешка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prata&family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen studio app. 3D model of the replanned flat on the left; panel with layout variants / piece / budget / timeline on the right; stacks on phones. */
:root{
  --bg:#ECEBE5; --surface:#F8F7F3; --ink:#2A1C1E; --muted:#6C6161; --line:#DBD6CD;
  --accent:#6B1E2C; --accent-ink:#FFF6F1; --sage:#55705F; --wood:#94552A; --scene:#E2DFD7;
  --kid:#E2A3B0; --wet:#8DB3D3;
  --chip-spend:#6B1E2C; --chip-copy:#4B6A5C; --chip-diy:#94552A; --chip-hunt:#4A3E3E; --chip-work:#3F5A7A;
  --bar-budget:#55705F; --bar-look:#C9B9AE;
  --f-display:'Prata', Georgia, 'Times New Roman', serif;
  --f-body:'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171314; --surface:#211B1C; --ink:#EEE6E1; --muted:#A99D9A; --line:#3A3031;
    --accent:#E3909E; --accent-ink:#2A1015; --sage:#9DB8AB; --wood:#D69560; --scene:#1E191A;
    --kid:#C9788A; --wet:#6F93B3;
    --chip-spend:#E3909E; --chip-copy:#9DB8AB; --chip-diy:#D69560; --chip-hunt:#CFC3BF; --chip-work:#9FB6D6;
    --bar-budget:#9DB8AB; --bar-look:#5A4C4C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171314; --surface:#211B1C; --ink:#EEE6E1; --muted:#A99D9A; --line:#3A3031;
  --accent:#E3909E; --accent-ink:#2A1015; --sage:#9DB8AB; --wood:#D69560; --scene:#1E191A;
  --kid:#C9788A; --wet:#6F93B3;
  --chip-spend:#E3909E; --chip-copy:#9DB8AB; --chip-diy:#D69560; --chip-hunt:#CFC3BF; --chip-work:#9FB6D6;
  --bar-budget:#9DB8AB; --bar-look:#5A4C4C; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;gap:12px;padding-inline:16px;padding-block:14px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
.top h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.15;margin:0;text-wrap:balance}
.top p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:66ch}
.cur{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:999px;cursor:pointer;font-family:var(--f-mono);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:12px}
.stage{position:relative;border-radius:16px;overflow:hidden;background:var(--scene);min-height:0;touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.labels{position:absolute;inset:0;pointer-events:none}
.room-tag{font-family:var(--f-body);font-size:12px;line-height:1.25;color:#2A1C1E;background:rgba(248,246,241,.9);border:1px solid rgba(42,28,30,.15);padding:3px 8px;border-radius:6px;text-align:center;white-space:nowrap}
.room-tag b{display:block;font-weight:600}
.room-tag span{font-family:var(--f-mono);font-size:11px;color:#6C6161}
.views{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.views button{pointer-events:auto;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 92%,transparent);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:500}
.views button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.views .sep{flex:1}
.hint{position:absolute;left:10px;bottom:10px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--surface) 88%,transparent);padding:4px 10px;border-radius:8px;pointer-events:none}
.pick{position:absolute;right:10px;bottom:10px;max-width:min(360px,calc(100% - 20px));display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:10px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.pick b{font-weight:600;font-size:14px}
.pick span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;padding:20px;text-align:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-height:0;overflow:auto;display:flex;flex-direction:column}
.tabs{position:sticky;top:0;z-index:2;display:flex;flex-wrap:wrap;gap:2px;padding:10px 10px 0;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:8px 10px 10px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{padding:16px 18px 22px;display:flex;flex-direction:column;gap:16px}
.pane h2{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.25;margin:0;text-wrap:balance}
.pane h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.pane p{margin:0}
.lede{color:var(--muted)}
.block{display:flex;flex-direction:column;gap:6px}
.vseg{display:flex;flex-wrap:wrap;gap:6px}
.vseg button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.vseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rec{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--accent);text-transform:uppercase}
.plan-wrap{display:flex;justify-content:center;padding:6px 0;overflow-x:auto}
.plan-wrap svg{max-width:100%;height:auto}
.plan-wrap .rm{stroke:none}
.z-social{fill:color-mix(in srgb,var(--accent) 24%,var(--surface))}
.z-sleep{fill:color-mix(in srgb,var(--sage) 30%,var(--surface))}
.z-kid{fill:color-mix(in srgb,var(--kid) 45%,var(--surface))}
.z-wet{fill:color-mix(in srgb,var(--wet) 40%,var(--surface))}
.z-pass{fill:color-mix(in srgb,var(--muted) 14%,var(--surface))}
.z-work{fill:color-mix(in srgb,var(--wood) 32%,var(--surface))}
.plan-wrap .wl{stroke:var(--ink);stroke-linecap:square}
.plan-wrap .rmv{stroke:var(--accent);stroke-dasharray:5 4;stroke-width:3}
.plan-wrap .add{stroke:var(--sage);stroke-width:5}
.plan-wrap .win{stroke:var(--wet);stroke-width:5}
.plan-wrap .zl{stroke:var(--muted);stroke-dasharray:3 3;stroke-width:1}
.plan-wrap text{fill:var(--ink);font-family:var(--f-body)}
.plan-wrap text.ar{font-family:var(--f-mono);fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.legend i.l{height:0;border-top:3px dashed var(--accent);border-radius:0;width:16px}
.legend i.a{height:0;border-top:4px solid var(--sage);border-radius:0;width:16px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pc ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.pc h3{margin-bottom:4px}
.swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sw{display:flex;flex-direction:column;gap:4px;min-width:0}
.sw i{display:block;height:38px;border-radius:8px;border:1px solid rgba(0,0,0,.12)}
.sw b{font-size:12px;font-weight:500;line-height:1.2}
.sw code{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.02em;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.chip.spend{color:var(--chip-spend)} .chip.copy{color:var(--chip-copy)} .chip.diy{color:var(--chip-diy)} .chip.hunt{color:var(--chip-hunt)} .chip.work{color:var(--chip-work)}
.piece-head{display:flex;flex-direction:column;gap:6px}
.piece-head .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.price{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.price.on{border-color:var(--sage)}
.price small{font-size:12px;color:var(--muted)}
.price b{font-family:var(--f-mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:14px;align-self:flex-start}
.totals{display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 10px;align-items:center}
.trow small{font-size:12px;color:var(--muted)}
.trow b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums;font-size:15px}
.bar{grid-column:1 / -1;height:10px;border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0;border-radius:5px}
.bar i.hi{opacity:.45}
.saving{font-size:14px}
.saving b{font-family:var(--f-mono);font-weight:500}
.group{display:flex;flex-direction:column}
.group h3{padding-bottom:6px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.row input{width:16px;height:16px;accent-color:var(--sage);margin:0}
.row .nm{display:flex;flex-direction:column;gap:3px;min-width:0;align-items:flex-start}
.row .nm button{border:0;background:none;padding:0;text-align:left;cursor:pointer;font-size:14px;line-height:1.3}
.row .nm button:hover{color:var(--accent)}
.row .pr{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row.off .nm button,.row.off .pr{color:var(--muted);text-decoration:line-through}
.note{font-size:13px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.steps li{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px}
.steps time{font-family:var(--f-mono);font-size:12px;color:var(--accent);padding-top:2px}
.steps b{display:block;font-weight:600;margin-bottom:2px}
.steps p{font-size:14px;color:var(--muted)}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.check li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px}
.check li::before{content:"";width:12px;height:12px;border:1.5px solid var(--sage);border-radius:3px;margin-top:4px}
.cta{border:1px dashed var(--sage);border-radius:12px;padding:12px 14px;font-size:14px}
@media (max-width:900px){
  html,body{height:auto}
  .app{height:auto}
  .layout{grid-template-columns:minmax(0,1fr)}
  .stage{height:62svh;min-height:380px}
  .panel{overflow:visible}
}
@media (max-width:440px){
  .top h1{font-size:24px}
  .swatches{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps li{grid-template-columns:minmax(0,1fr)}
  .pc{grid-template-columns:minmax(0,1fr)}
  .hint{display:none}
}
</style>

<div class="app">
  <header class="top">
    <div>
      <h1>Наша евротрешка</h1>
      <p>Ваша двушка 58,94 м², переделанная в евротрешку в стиле видео: кухня-гостиная, спальня с рабочим местом и детская с игровой и уголком для намаза.</p>
    </div>
    <div class="cur">Цены в
      <span class="seg" role="group" aria-label="Валюта">
        <button type="button" id="cur-kzt" data-cur="kzt">₸</button>
        <button type="button" id="cur-rub" data-cur="rub">₽</button>
        <button type="button" id="cur-gbp" data-cur="gbp">£</button>
      </span>
    </div>
  </header>

  <main class="layout">
    <section class="stage" id="stage" aria-label="3D-модель квартиры">
      <div class="views" id="views">
        <button type="button" data-view="overview" aria-pressed="true">Обзор</button>
        <button type="button" data-view="kl">Кухня-гостиная</button>
        <button type="button" data-view="bedroom">Спальня</button>
        <button type="button" data-view="kids">Детская</button>
        <button type="button" data-view="hall">Вход</button>
        <span class="sep"></span>
        <button type="button" id="walls-btn" aria-pressed="false">Стены целиком</button>
      </div>
      <div class="hint">Тяните, чтобы вращать · колесо или щипок — зум · нажмите на любую вещь</div>
      <button type="button" class="pick" id="pick" hidden></button>
      <div class="msg" id="msg">Загружаю 3D-модель…</div>
    </section>

    <aside class="panel" id="panel">
      <nav class="tabs" role="tablist">
        <button type="button" role="tab" aria-selected="true" data-tab="plan">Планировка</button>
        <button type="button" role="tab" aria-selected="false" data-tab="piece">Вещь</button>
        <button type="button" role="tab" aria-selected="false" data-tab="budget">Бюджет</button>
        <button type="button" role="tab" aria-selected="false" data-tab="time">Сроки</button>
      </nav>
      <div class="pane" id="pane-plan" role="tabpanel"></div>
      <div class="pane" id="pane-piece" role="tabpanel" hidden></div>
      <div class="pane" id="pane-budget" role="tabpanel" hidden></div>
      <div class="pane" id="pane-time" role="tabpanel" hidden></div>
    </aside>
  </main>
</div>

<script>
/* ---------- Pieces in the model, priced two ways ---------- */
const TAGS = {
  spend:{label:'Здесь не экономить', cls:'spend'},
  copy:{label:'Бюджетный аналог', cls:'copy'},
  diy:{label:'Покрасить / своими руками', cls:'diy'},
  hunt:{label:'Искать б/у', cls:'hunt'},
  work:{label:'Работы', cls:'work'}
};
const ZONES = ['Вся квартира','Кухня-гостиная','Спальня','Детская','Вход и ванная'];
// b = бюджетный путь, l = как в видео. [₽ от, ₽ до, £ от, £ до]; ₸ считается из ₽
const ITEMS = {
  replan:{zone:'Вся квартира',name:'Проект и согласование перепланировки',tag:'work',b:[25e3,60e3,300,700],l:[25e3,60e3,300,700],
    idea:'Убираем стену между кухней и коридором и ставим новую перегородку с дверями. Даже ненесущие стены меняют только по проекту и с согласованием.',
    budget:'Сначала попросите у застройщика план с несущими конструкциями. Перегородки из газоблока 100 мм обычно не несущие, но это нужно подтвердить. Стояк в углу кухни трогать нельзя.'},
  works:{zone:'Вся квартира',name:'Снос стены и новая перегородка',tag:'work',b:[30e3,60e3,400,800],l:[30e3,60e3,400,800],
    idea:'Красная полоса на полу в модели — там, где сейчас стена между кухней и коридором. Новая перегородка с дверями отделяет спальную зону.',
    budget:'Демонтаж тонкой перегородки и новая стена из газоблока или ГКЛ со звукоизоляцией. Делается в одном этапе с черновыми работами.'},
  floor:{zone:'Вся квартира',name:'Пол «ёлочка», светлый дуб',tag:'copy',b:[110e3,180e3,1200,2000],l:[350e3,600e3,3200,5500],
    idea:'Светлая ёлочка во всех комнатах, кроме ванной, связывает квартиру в одно целое.',
    budget:'SPC-винил или ламинат «ёлочка» под натуральный дуб: с пары шагов не отличить от паркета, кладётся быстрее. Цена — материал примерно на 50 м².'},
  walls:{zone:'Вся квартира',name:'Тёплые белые стены',tag:'diy',b:[25e3,45e3,250,450],l:[60e3,100e3,700,1100],
    idea:'Матовый тёплый белый везде, без акцентных стен. Цвет дают мебель и текстиль.',
    budget:'Одна хорошая моющаяся матовая краска с колеровкой на все комнаты. Красить самим — самая большая экономия на работах.'},
  doors:{zone:'Вся квартира',name:'Шалфейные двери в спальную зону',tag:'diy',b:[35e3,70e3,400,800],l:[120e3,250e3,1500,3000],
    idea:'Двойные двери со стеклом, как в видео. За ними маленький холл: вход в спальню, детскую и ванную. Гости и шум кухни остаются снаружи.',
    budget:'Стандартные остеклённые двери под покраску, покрасить самим в шалфейный. Округлое стекло — у стекольщика.'},
  curtains:{zone:'Вся квартира',name:'Шторы от потолка до пола',tag:'copy',tall:true,b:[10e3,22e3,100,220],l:[50e3,100e3,500,1000],
    idea:'Льняные шторы на потолочном карнизе: тауп в спальне, светлые в детской.',
    budget:'Потолочный карниз и шторы до пола. Высота делает недорогую ткань похожей на пошив на заказ.'},
  rugs:{zone:'Вся квартира',name:'Ковры',tag:'copy',b:[12e3,25e3,120,250],l:[60e3,130e3,600,1300],
    idea:'Джутовый ковёр в кухне-гостиной, мягкий под кроватью в спальне.',
    budget:'Безворсовые ковры из джута или шерсти с синтетикой. Размер важнее цены.'},
  art:{zone:'Вся квартира',name:'Картины и постеры',tag:'copy',b:[3e3,8e3,30,80],l:[30e3,80e3,300,800],
    idea:'Простые постеры в широком паспарту и небольшие наивные картины.',
    budget:'Купите или скачайте постеры, оформите в рамки с паспарту. Картину с домиком легко нарисовать самим.'},

  kitchen:{zone:'Кухня-гостиная',name:'Кухня: дубовые фасады, белая столешница',tag:'spend',b:[200e3,350e3,2500,4500],l:[600e3,1000e3,8000,13000],
    idea:'Кухня остаётся на месте вдоль правой стены, у стояка. Без верхних шкафов: рейлинг и полка, как в видео.',
    budget:'Стандартные модульные корпуса, фасады под дуб, белая столешница. Деньги — в петли, ящики и столешницу. Цена без техники.'},
  sofa:{zone:'Кухня-гостиная',name:'Бордовый вельветовый диван',tag:'spend',b:[55e3,100e3,550,950],l:[160e3,300e3,1600,3200],
    idea:'Диван 2 м вдоль стены спальни, лицом к кухне. Этот цвет задаёт всю квартиру.',
    budget:'Простой крепкий каркас, ткань выберите сами. Многие мебельные цеха шьют на заказ в вельвете по цене массмаркета. Сядьте перед покупкой: глубина сиденья от 60 см.'},
  'coffee-table':{zone:'Кухня-гостиная',name:'Оранжевый круглый столик',tag:'diy',b:[4e3,10e3,40,100],l:[30e3,60e3,300,700],

const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v==null? d : JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const state = { cur: store.get('home.cur','kzt'), off:new Set(store.get('home.off',[])), sel:null, variant: store.get('home.var','v2') };
const KZT_PER_RUB = 6;

/* ---------- Money ---------- */
function vals(arr,cur){ return cur==='gbp'? [arr[2],arr[3]] : cur==='kzt'? [arr[0]*KZT_PER_RUB, arr[1]*KZT_PER_RUB] : [arr[0],arr[1]]; }
function big(v){ return v>=1e6 ? (Math.round(v/1e5)/10).toString().replace('.',',')+' млн' : Math.round(v/1000)+' тыс.'; }
function fmtPair(lo,hi,cur){
  if(cur==='gbp') return '£'+lo.toLocaleString('ru-RU')+'–'+hi.toLocaleString('ru-RU');
  const sym = cur==='kzt'?'₸':'₽';
  if(hi<1e6) return Math.round(lo/1000)+'–'+Math.round(hi/1000)+' тыс. '+sym;
  if(lo>=1e6) return big(lo).replace(' млн','')+'–'+big(hi)+' '+sym;
  return big(lo)+' – '+big(hi)+' '+sym;
}
const range = (arr,cur)=>{ const [a,b]=vals(arr,cur); return fmtPair(a,b,cur); };
function sumOf(field,cur){ let lo=0,hi=0; for(const [k,it] of Object.entries(ITEMS)){ if(state.off.has(k)) continue; const [a,b]=vals(it[field],cur); lo+=a; hi+=b; } return [lo,hi]; }
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const chip = t => `<span class="chip ${TAGS[t].cls}">${TAGS[t].label}</span>`;

/* ---------- Plan SVG ---------- */
function planSVG(v){
  const s=30, p=14, W=6.95*s+p*2, H=12.5*s+p*2, X=x=>(p+x*s).toFixed(1), Y=z=>(p+z*s).toFixed(1);
  let o=`<svg viewBox="0 0 ${W.toFixed(0)} ${H.toFixed(0)}" width="${W.toFixed(0)}" height="${H.toFixed(0)}" role="img" aria-label="План: ${esc(v.title)}">`;
  for(const [k,cls] of v.rooms){ const r=R[k]; o+=`<rect class="rm ${cls}" x="${X(r[0])}" y="${Y(r[1])}" width="${((r[2]-r[0])*s).toFixed(1)}" height="${((r[3]-r[1])*s).toFixed(1)}"/>`; }
  if(v.zline){ const l=v.zline; o+=`<line class="zl" x1="${X(l[0])}" y1="${Y(l[1])}" x2="${X(l[2])}" y2="${Y(l[3])}"/>`; }
  for(const l of v.walls) o+=`<line class="wl" stroke-width="2" x1="${X(l[0])}" y1="${Y(l[1])}" x2="${X(l[2])}" y2="${Y(l[3])}"/>`;
  o+=`<line class="wl" stroke-width="2" x1="${X(3.22)}" y1="${Y(7)}" x2="${X(3.22)}" y2="${Y(12.5)}"/>`;
  o+=`<polyline class="wl" fill="none" stroke-width="5" points="${X(0)},${Y(0)} ${X(6.95)},${Y(0)} ${X(6.95)},${Y(4.95)}"/>`;
  o+=`<polyline class="wl" fill="none" stroke-width="5" points="${X(6.95)},${Y(6.0)} ${X(6.95)},${Y(7)} ${X(3.22)},${Y(7)} ${X(3.22)},${Y(12.5)} ${X(0)},${Y(12.5)} ${X(0)},${Y(0)}"/>`;
  for(const w of WINDOWS) o+=`<line class="win" x1="${X(w[0])}" y1="${Y(w[1])}" x2="${X(w[2])}" y2="${Y(w[3])}"/>`;
  for(const l of v.removed) o+=`<line class="rmv" x1="${X(l[0])}" y1="${Y(l[1])}" x2="${X(l[2])}" y2="${Y(l[3])}"/>`;
  for(const l of v.added) o+=`<line class="add" x1="${X(l[0])}" y1="${Y(l[1])}" x2="${X(l[2])}" y2="${Y(l[3])}"/>`;
  o+=`<text class="ar" font-size="10" x="${X(6.95)-2}" y="${Y(5.55)}" text-anchor="end">вход →</text>`;
  for(const [k,,name,area] of v.rooms){ if(!name) continue; const r=R[k]; let cx=(r[0]+r[2])/2, cz=(r[1]+r[3])/2; if(k==='kitchen' && !v.walls.some(w=>w[1]===4.91&&w[0]===3.65&&w[2]===6.95)) cz=3.6;
    const small = (r[2]-r[0])<2;
    o+=`<text font-size="${small?10:12}" font-weight="600" x="${X(cx)}" y="${Y(cz)}" text-anchor="middle">${esc(name)}</text>`;
    if(area) o+=`<text class="ar" font-size="10" x="${X(cx)}" y="${(+Y(cz)+13).toFixed(1)}" text-anchor="middle">${esc(area)}</text>`; }
  return o+'</svg>';
}

    el.innerHTML=`

    <div class="block"><h3>Как сэкономить</h3><p>${esc(it.budget)}</p></div>
    <p class="note">${state.off.has(k)?'Не входит в ваш итог.':'Входит в ваш итог.'} Цены — грубые диапазоны 2026 года, проверяйте перед покупкой.</p>

function renderBudget(){
  const el=document.getElementById('pane-budget'), cur=state.cur;
  const b=sumOf('b',cur), l=sumOf('l',cur), max=Math.max(l[1],1), pct=v=>(v/max*100).toFixed(1)+'%';
  let html=`
    <div class="block"><h2>Бюджет на обстановку</h2>
      <p class="lede">Снимите галочку с того, что уже есть или не нужно, — итог пересчитается.</p></div>
    <div class="totals">
      <div class="trow"><small>Бюджетный путь</small><b>${fmtPair(b[0],b[1],cur)}</b>

      <div class="trow"><small>Как в видео</small><b>${fmtPair(l[0],l[1],cur)}</b>
        <div class="bar" aria-hidden="true"><i class="hi" style="width:${pct(l[1])};background:var(--bar-look)"></i><i style="width:${pct(l[0])};background:var(--bar-look)"></i></div></div>

      <p class="note">Не входят: черновые работы и работа мастеров (электрика, штукатурка, стяжка, плитка), кухонная техника и матрасы.${cur==='kzt'?' Тенге пересчитаны из рублей по курсу около 6 ₸ за ₽; местные цены могут отличаться.':''}</p>

  for(const z of ZONES){
    const rows=Object.entries(ITEMS).filter(([,it])=>it.zone===z);
    html+=`<div class="group"><h3>${z}</h3>${rows.map(([k,it])=>{ const off=state.off.has(k);

function updatePick(){

}
function setTab(t){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t)));

}
function setCur(c){
  state.cur=c; store.set('home.cur',c);

}
const APP = window.APP = {

    if(src==='list') document.getElementById('stage').scrollIntoView({behavior:'smooth',block:'nearest'});
  }
};
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setCur(b.dataset.cur));

setTimeout(()=>{ const m=document.getElementById('msg'); if(m && !m.hidden) m.textContent='3D-модель не загрузилась. Проверьте интернет и обновите страницу; планировка и бюджет работают и так.'; },15000);
</script>

function overviewPose(){ const a=camera.aspect; return a>=1 ? {pos:[15.5,13.5,6.2],look:[3.3,0,6.2]} : {pos:[3.4,18,19.5],look:[3.3,0,6.0]}; }

const ROOM_C={'Кухня-гостиная':[5.2,4.0],'Спальня':[1.8,2.5],'Детская':[1.6,9.8],'Вход и ванная':[4.5,5.8]};
function setWalls(full){
  wallsFull=full; buildWalls(full?WALL_H:CUT_H);
  TALL.forEach(o=>o.visible=full); ceil.visible=full;
  labels.forEach(l=>l.visible=!full); labelR.domElement.style.display = full? 'none':'';
  document.getElementById('walls-btn').setAttribute('aria-pressed',String(full));
}
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let tween=null;
function flyTo(pos,target,polar,dur=1000){
  const p0=camera.position.clone(), t0=controls.target.clone(), p1=new THREE.Vector3(...pos), t1=new THREE.Vector3(...target);
  const after=()=>{ controls.maxPolarAngle=polar; };
  if(reduce){ camera.position.copy(p1); controls.target.copy(t1); after(); controls.update(); return; }
  controls.maxPolarAngle=Math.PI; tween={p0,t0,p1,t1,start:performance.now(),dur,after};
}
function setFov(f){ camera.fov=f; camera.updateProjectionMatrix(); }
function pressView(name){ document.querySelectorAll('#views [data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===name))); }
function goView(name){
  const v=VIEWS[name]; pressView(name); setWalls(v.full); setFov(v.full?62:40);
  if(!v.full){ const o=overviewPose(); flyTo(o.pos,o.look,Math.PI*0.47); return; }
  const p=new THREE.Vector3(...v.pos), l=new THREE.Vector3(...v.look);
  const t=p.clone().add(l.sub(p).normalize().multiplyScalar(1.2));
  flyTo(v.pos,[t.x,t.y,t.z],Math.PI*0.8);
}
document.querySelectorAll('#views [data-view]').forEach(b=>b.onclick=()=>goView(b.dataset.view));
document.getElementById('walls-btn').onclick=()=>setWalls(!wallsFull);

/* ---------- selection ---------- */
const helpers=[];
function clearHelpers(){ helpers.forEach(h=>{ scene.remove(h); h.geometry.dispose(); }); helpers.length=0; }
APP.highlight=(key,src)=>{
  clearHelpers();
  if(!key) return;
  const all=GROUPS[key]||[], gs=all.filter(g=>g.visible!==false);
  if(key!=='walls' && key!=='floor') gs.forEach(g=>{ const h=new THREE.BoxHelper(g,0xE4A33B); h.material.depthTest=false; h.renderOrder=10; scene.add(h); helpers.push(h); });
  if(src!=='list') return;
  const it=APP.ITEMS[key];
  if(it.tall){ goView(ZONE_VIEW[it.zone]||'bedroom'); APP.highlight(key,'scene'); return; }
  if(!all.length) return;
  if(it.zone==='Вся квартира' && key!=='works'){ goView('overview'); return; }
  const box=new THREE.Box3(); all.forEach(g=>box.expandByObject(g));
  const c=box.getCenter(new THREE.Vector3()), size=box.getSize(new THREE.Vector3()).length();
  if(wallsFull){ setWalls(false); pressView(''); }
  setFov(40);
  const rc=ROOM_C[it.zone]||[c.x+1,c.z+1];
  const dir=new THREE.Vector3(rc[0]-c.x,0,rc[1]-c.z); if(dir.length()<0.6) dir.set(0.6,0,0.8); dir.normalize();
  const dist=Math.max(3.6,size*1.8);
  const pos=c.clone().add(dir.multiplyScalar(dist*0.85)).add(new THREE.Vector3(0,dist*0.7,0));
  flyTo([pos.x,pos.y,pos.z],[c.x,c.y,c.z],Math.PI*0.47);
};
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
function keyAt(ev){
  const r=renderer.domElement.getBoundingClientRect(); ptr.set(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ptr,camera);
  for(const h of ray.intersectObjects(scene.children,true)){ let o=h.object, vis=true, key=null; while(o){ if(o.visible===false){vis=false;break;} if(!key && o.userData.key) key=o.userData.key; o=o.parent; } if(vis && key && APP.ITEMS[key]) return key; }
  return null;
}
let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY}; if(tween){ tween.after(); tween=null; } });
renderer.domElement.addEventListener('pointerup',e=>{ if(!down) return; const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y); down=null; if(moved>6) return; APP.select(keyAt(e)||null,'scene'); });
renderer.domElement.addEventListener('pointermove',e=>{ if(e.pointerType!=='mouse'||down) return; renderer.domElement.style.cursor = keyAt(e)? 'pointer':'grab'; });

function applyBg(){ const c=getComputedStyle(document.documentElement).getPropertyValue('--scene').trim()||'#E2DFD7'; scene.background=new THREE.Color(c); }
applyBg();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyBg);
new MutationObserver(applyBg).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

function resize(){ const w=stage.clientWidth,h=stage.clientHeight; if(!w||!h) return; renderer.setSize(w,h,false); labelR.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();

setWalls(false);
{ const o=overviewPose(); camera.position.set(...o.pos); controls.target.set(...o.look); controls.maxPolarAngle=Math.PI*0.47; controls.update(); }
const ease=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function loop(now){
  if(tween){ const t=Math.min(1,(now-tween.start)/tween.dur), k=ease(t); camera.position.lerpVectors(tween.p0,tween.p1,k); controls.target.lerpVectors(tween.t0,tween.t1,k); if(t>=1){ tween.after(); tween=null; } }
  controls.update(); helpers.forEach(h=>h.update());
  renderer.render(scene,camera); labelR.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.getElementById('msg').hidden=true;
