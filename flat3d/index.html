<title>Burgundy &amp; Sage Flat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen studio app. 3D model on the left, a working panel (piece / budget / plan) on the right; stacks on phones. */
:root{
  --bg:#ECEBE5; --surface:#F8F7F3; --ink:#2A1C1E; --muted:#6C6161; --line:#DBD6CD;
  --accent:#6B1E2C; --accent-ink:#FFF6F1; --sage:#55705F; --wood:#94552A; --scene:#E2DFD7;
  --chip-spend:#6B1E2C; --chip-copy:#4B6A5C; --chip-diy:#94552A; --chip-hunt:#4A3E3E;
  --bar-budget:#55705F; --bar-look:#C9B9AE;
  --f-display:'Young Serif', Georgia, 'Times New Roman', serif;
  --f-body:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171314; --surface:#211B1C; --ink:#EEE6E1; --muted:#A99D9A; --line:#3A3031;
    --accent:#E3909E; --accent-ink:#2A1015; --sage:#9DB8AB; --wood:#D69560; --scene:#1E191A;
    --chip-spend:#E3909E; --chip-copy:#9DB8AB; --chip-diy:#D69560; --chip-hunt:#CFC3BF;
    --bar-budget:#9DB8AB; --bar-look:#5A4C4C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171314; --surface:#211B1C; --ink:#EEE6E1; --muted:#A99D9A; --line:#3A3031;
  --accent:#E3909E; --accent-ink:#2A1015; --sage:#9DB8AB; --wood:#D69560; --scene:#1E191A;
  --chip-spend:#E3909E; --chip-copy:#9DB8AB; --chip-diy:#D69560; --chip-hunt:#CFC3BF;
  --bar-budget:#9DB8AB; --bar-look:#5A4C4C; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;gap:12px;padding-inline:16px;padding-block:14px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
.top h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.1;margin:0;text-wrap:balance}
.top p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:62ch}
.cur{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:999px;cursor:pointer;font-family:var(--f-mono);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:12px}
.stage{position:relative;border-radius:16px;overflow:hidden;background:var(--scene);min-height:0;touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.labels{position:absolute;inset:0;pointer-events:none}
.room-tag{font-family:var(--f-body);font-size:12px;line-height:1.25;color:#2A1C1E;background:rgba(248,246,241,.88);border:1px solid rgba(42,28,30,.15);padding:3px 8px;border-radius:6px;text-align:center;white-space:nowrap}
.room-tag b{display:block;font-weight:600}
.room-tag span{font-family:var(--f-mono);font-size:11px;color:#6C6161}
.views{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.views button{pointer-events:auto;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 92%,transparent);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px;font-weight:500}
.views button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.views .sep{flex:1}
.hint{position:absolute;left:10px;bottom:10px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--surface) 88%,transparent);padding:4px 10px;border-radius:8px;pointer-events:none}
.pick{position:absolute;right:10px;bottom:10px;max-width:min(360px,calc(100% - 20px));display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:10px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.12)}
.pick b{font-weight:600;font-size:14px}
.pick span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;padding:20px;text-align:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-height:0;overflow:auto;display:flex;flex-direction:column}
.tabs{position:sticky;top:0;z-index:2;display:flex;gap:4px;padding:10px 12px 0;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:8px 12px 10px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{padding:16px 18px 22px;display:flex;flex-direction:column;gap:16px}
.pane h2{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.2;margin:0;text-wrap:balance}
.pane h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:600}
.pane p{margin:0}
.lede{color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sw{display:flex;flex-direction:column;gap:4px;min-width:0}
.sw i{display:block;height:42px;border-radius:8px;border:1px solid rgba(0,0,0,.12)}
.sw b{font-size:12px;font-weight:500;line-height:1.2}
.sw code{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.rules{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.rules li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline}
.rules li > span:first-child{min-width:0}
.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.chip.spend{color:var(--chip-spend)} .chip.copy{color:var(--chip-copy)} .chip.diy{color:var(--chip-diy)} .chip.hunt{color:var(--chip-hunt)}
.piece-head{display:flex;flex-direction:column;gap:6px}
.piece-head .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.block{display:flex;flex-direction:column;gap:6px}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.price{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.price.on{border-color:var(--sage)}
.price small{font-size:12px;color:var(--muted)}
.price b{font-family:var(--f-mono);font-weight:500;font-size:17px;font-variant-numeric:tabular-nums}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:14px;align-self:flex-start}
.totals{display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 10px;align-items:center}
.trow small{font-size:12px;color:var(--muted)}
.trow b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums;font-size:15px}
.bar{grid-column:1 / -1;height:10px;border-radius:5px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0;border-radius:5px}
.bar i.lo{opacity:1} .bar i.hi{opacity:.45}
.saving{font-size:14px}
.saving b{font-family:var(--f-mono);font-weight:500}
.group{display:flex;flex-direction:column}
.group h3{padding-bottom:6px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.row input{width:16px;height:16px;accent-color:var(--sage);margin:0}
.row .nm{display:flex;flex-direction:column;gap:3px;min-width:0;align-items:flex-start}
.row .nm button{border:0;background:none;padding:0;text-align:left;cursor:pointer;font-size:14px;line-height:1.3}
.row .nm button:hover{color:var(--accent)}
.row .pr{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row.off .nm button,.row.off .pr{color:var(--muted);text-decoration:line-through}
.note{font-size:13px;color:var(--muted)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px}
.steps time{font-family:var(--f-mono);font-size:12px;color:var(--accent);padding-top:2px}
.steps b{display:block;font-weight:600;margin-bottom:2px}
.steps p{font-size:14px;color:var(--muted)}
.check{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.check li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px}
.check li::before{content:"";width:12px;height:12px;border:1.5px solid var(--sage);border-radius:3px;margin-top:4px}
.cta{border:1px dashed var(--sage);border-radius:12px;padding:12px 14px;font-size:14px}
@media (max-width:880px){
  html,body{height:auto}
  .app{height:auto}
  .layout{grid-template-columns:minmax(0,1fr)}
  .stage{height:62svh;min-height:380px}
  .panel{overflow:visible}
  .swatches{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (max-width:440px){
  .top h1{font-size:24px}
  .swatches{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps li{grid-template-columns:minmax(0,1fr)}
  .hint{display:none}
}
</style>

<div class="app">
  <header class="top">
    <div>
      <h1>Burgundy &amp; Sage Flat</h1>
      <p>A 3D reconstruction of the apartment in your video, priced two ways: the original look and a budget route for your renovation after March 2027.</p>
    </div>
    <div class="cur">Prices in
      <span class="seg" role="group" aria-label="Currency">
        <button type="button" id="cur-rub" data-cur="rub">₽</button>
        <button type="button" id="cur-gbp" data-cur="gbp">£</button>
      </span>
    </div>
  </header>

  <main class="layout">
    <section class="stage" id="stage" aria-label="3D model of the apartment">
      <div class="views" id="views">
        <button type="button" data-view="overview" aria-pressed="true">Overview</button>
        <button type="button" data-view="living">Living room</button>
        <button type="button" data-view="kitchen">Kitchen</button>
        <button type="button" data-view="bedroom">Bedroom</button>
        <span class="sep"></span>
        <button type="button" id="walls-btn" aria-pressed="false">Full-height walls</button>
      </div>
      <div class="hint" id="hint">Drag to rotate · scroll or pinch to zoom · tap any piece</div>
      <button type="button" class="pick" id="pick" hidden></button>
      <div class="msg" id="msg">Loading the 3D model…</div>
    </section>

    <aside class="panel" id="panel">
      <nav class="tabs" role="tablist">
        <button type="button" role="tab" id="t-piece" aria-selected="true" data-tab="piece">Look</button>
        <button type="button" role="tab" id="t-budget" aria-selected="false" data-tab="budget">Budget</button>
        <button type="button" role="tab" id="t-plan" aria-selected="false" data-tab="plan">Plan to 2027</button>
      </nav>
      <div class="pane" id="pane-piece" role="tabpanel"></div>
      <div class="pane" id="pane-budget" role="tabpanel" hidden></div>
      <div class="pane" id="pane-plan" role="tabpanel" hidden></div>
    </aside>
  </main>
</div>

<script>
/* ---------- Data: every piece in the model, priced two ways ---------- */
const TAGS = {
  spend:{label:'Spend here', cls:'spend'},
  copy:{label:'Budget copy', cls:'copy'},
  diy:{label:'Paint / DIY', cls:'diy'},
  hunt:{label:'Buy second-hand', cls:'hunt'}
};
const ZONES = ['Whole flat','Living room','Kitchen & dining','Bedroom','Hall & bathroom'];
// b = budget route, l = original look. Each: [rub lo, rub hi, gbp lo, gbp hi]
const ITEMS = {
  floor:{zone:'Whole flat',name:'Oak herringbone floor',tag:'copy',b:[120e3,200e3,1300,2200],l:[400e3,650e3,3500,6000],
    video:'Light natural-oak herringbone runs through every room, which ties the flat together.',
    budget:'Herringbone SPC vinyl or laminate in natural oak reads as parquet from a few steps away and is quicker to lay. If you want real wood, use engineered oak in the living room only. Price is materials for about 60 m².'},
  walls:{zone:'Whole flat',name:'Warm white walls',tag:'diy',b:[25e3,45e3,250,450],l:[60e3,100e3,700,1100],
    video:'Matt warm-white walls everywhere and no feature walls. All the colour comes from furniture and fabric.',
    budget:'One good washable matt paint, tinted warm white, for every room. Painting yourself is where you save the most labour.'},
  doors:{zone:'Whole flat',name:'Sage double doors with arched glass',tag:'diy',b:[35e3,70e3,400,800],l:[120e3,250e3,1500,3000],
    video:'Grey-green double doors with tall rounded glass panels between the living room and the kitchen.',
    budget:'Buy standard glazed interior doors primed for painting and paint them sage yourself; ask the joiner or glazier for the rounded glass. The cheapest option is to skip doors and paint the frame of a wide opening sage.'},
  curtains:{zone:'Whole flat',name:'Floor-to-ceiling curtains',tag:'copy',tall:true,b:[12e3,25e3,120,250],l:[60e3,120e3,600,1200],
    video:'Linen-look curtains from ceiling to floor: cream in the living room, taupe in the bedroom.',
    budget:'Hang them from a ceiling track and let them touch the floor. The full height makes inexpensive fabric look made to measure.'},
  art:{zone:'Whole flat',name:'Framed prints and naive paintings',tag:'copy',b:[3e3,8e3,30,80],l:[30e3,100e3,300,1000],
    video:'Simple framed prints with wide white mounts, plus small naive paintings in sage and blue.',
    budget:'Buy or download prints and frame them with wide mounts. The little house painting is easy to paint yourself.'},
  rugs:{zone:'Whole flat',name:'Jute and flatweave rugs',tag:'copy',b:[14e3,30e3,140,300],l:[70e3,150e3,700,1500],
    video:'A natural jute flatweave in the living room and a muted mauve rug in the bedroom.',
    budget:'Flatweave jute or wool-blend rugs. Size matters more than price: at least 2 × 3 m in the living room.'},

  sofa:{zone:'Living room',name:'Burgundy corduroy sofa',tag:'spend',b:[60e3,110e3,600,1000],l:[180e3,320e3,1800,3500],
    video:'A low, deep sofa in wide-wale wine corduroy. It sets the colour for the whole flat.',
    budget:'Buy a solid, plain frame and choose the fabric yourself. Many local sofa workshops make to order in corduroy at mass-market prices. Sit-test first: seat depth of 60 cm or more and firm foam. This is the one big piece worth stretching for.'},
  'chandelier-living':{zone:'Living room',name:'Pink Murano petal chandelier',tag:'copy',b:[15e3,35e3,150,350],l:[90e3,250e3,900,2500],
    video:'A vintage-style Murano "petal" chandelier in blush glass.',
    budget:'Search marketplaces for "Murano petal chandelier" or "Selle chandelier". Choose glass petals rather than acrylic, because the glow is the whole effect.'},
  shelving:{zone:'Living room',name:'Oak open shelving wall',tag:'copy',b:[60e3,110e3,500,900],l:[200e3,350e3,2500,5000],
    video:'Built-in oak shelving: an asymmetric open grid above closed cupboards.',
    budget:'Ask a cabinet maker to build it in oak-décor laminated board with real-wood edging instead of veneer. Keep the uneven grid; that is what makes it look designed. In the UK, a hack of IKEA base units with custom shelves above also works.'},
  'coffee-table':{zone:'Living room',name:'Orange lacquer drum table',tag:'diy',b:[4e3,10e3,40,100],l:[30e3,60e3,300,700],
    video:'A round drum coffee table in glossy tomato orange.',
    budget:'Any round drum or pedestal table plus gloss enamel in tomato orange. This one small hit of orange lifts the burgundy and sage.'},
  armchair:{zone:'Living room',name:'Cream bouclé chair on chrome',tag:'copy',b:[15e3,30e3,150,300],l:[80e3,150e3,800,1800],
    video:'A cream bouclé lounge chair on a chrome tube frame, by the window.',
    budget:'Bouclé chairs on chrome frames are widely reproduced. Check that the frame is steel and the seat is deep enough.'},
  'floor-lamp':{zone:'Living room',name:'Chrome floor lamp, yellow shade',tag:'copy',b:[4e3,9e3,40,90],l:[25e3,50e3,250,500],
    video:'A slim chrome floor lamp with a small yellow saucer shade.',
    budget:'Any simple chrome reading lamp. If you cannot find a yellow shade, spray-paint one.'},
  'sideboard-living':{zone:'Living room',name:'Cream and burgundy sideboard',tag:'diy',b:[6e3,15e3,60,150],l:[60e3,120e3,600,1200],
    video:'A low sideboard with cream doors on one side and burgundy drawers on the other.',
    budget:'Buy any second-hand cabinet with doors and drawers, paint the doors cream and the drawers burgundy, and add round wooden knobs.'},

  kitchen:{zone:'Kitchen & dining',name:'Oak kitchen, white worktop',tag:'spend',b:[250e3,400e3,3000,5000],l:[700e3,1200e3,9000,15000],
    video:'Oak fronts, a white worktop, no wall cupboards, and a tall column with the oven and frosted-glass display doors.',
    budget:'Standard modular cabinets with oak-look fronts and a white laminate or compact worktop. Leaving out wall cupboards saves money and keeps the airy look. Spend on hinges, drawer runners and the worktop, because they take daily wear. Price excludes appliances.'},
  table:{zone:'Kitchen & dining',name:'Round cherry pedestal table',tag:'hunt',b:[15e3,35e3,150,350],l:[80e3,180e3,800,2000],
    video:'A round cherry-wood table on a chunky turned pedestal.',
    budget:'Hunt for a second-hand round pedestal table and refinish it with cherry stain. A woodworker can also turn a chunky base for a plain round top.'},
  chairs:{zone:'Kitchen & dining',name:'Danish-style chairs (×3)',tag:'hunt',b:[12e3,30e3,120,300],l:[90e3,200e3,1200,3000],
    video:'Mid-century teak chairs with curved back rails and cream bouclé seats.',
    budget:'Look for vintage mid-century chairs second-hand. Mixed models are fine. Re-cover the seats in bouclé with a staple gun and about 1 m of fabric.'},
  'chandelier-kitchen':{zone:'Kitchen & dining',name:'Pastel petal chandelier',tag:'copy',b:[15e3,30e3,150,300],l:[90e3,200e3,900,2000],
    video:'A multicolour pastel petal chandelier over the dining table.',
    budget:'Same search as the living-room one, in a mixed pastel colourway. Hang the bottom about 75 cm above the table top.'},
  bench:{zone:'Kitchen & dining',name:'Window bench with scalloped skirt',tag:'diy',b:[15e3,30e3,150,300],l:[60e3,120e3,600,1200],
    video:'A built-in window seat with a striped cushion and a scalloped fabric skirt.',
    budget:'A carpenter builds a plywood box with storage inside; you add foam and a striped ticking cover. Cut the scalloped skirt from the same fabric.'},
  blinds:{zone:'Kitchen & dining',name:'Wooden venetian blinds',tag:'copy',tall:true,b:[6e3,12e3,60,120],l:[20e3,40e3,200,400],
    video:'Mid-brown wooden venetian blinds on the kitchen window.',
    budget:'Made-to-measure basswood or bamboo venetian blinds. 50 mm slats look closest to the video.'},
  'side-table':{zone:'Kitchen & dining',name:'Black hourglass side table',tag:'copy',b:[3e3,7e3,30,70],l:[20e3,40e3,200,400],
    video:'A small black hourglass table at the end of the window bench.',
    budget:'Hourglass stools in black are easy to find. A plastic one is fine here.'},
  console:{zone:'Kitchen & dining',name:'Arched walnut coffee console',tag:'hunt',b:[12e3,25e3,120,250],l:[60e3,120e3,600,1200],
    video:'A dark walnut console with two arches and turned legs, used as the coffee station.',
    budget:'Search for an "arched console", or have a woodworker cut arches into the front of a plain console, then stain it dark walnut.'},
  kettle:{zone:'Kitchen & dining',name:'Cream kettle and espresso machine',tag:'copy',b:[8e3,18e3,80,180],l:[60e3,100e3,500,900],
    video:'A cream retro kettle and a cream espresso machine on the console.',
    budget:'Retro kettles from budget brands look almost the same. Choose cream to match the sideboard doors.'},

  bed:{zone:'Bedroom',name:'Bed with velvet headboard',tag:'diy',b:[35e3,60e3,350,600],l:[150e3,250e3,1500,2500],
    video:'A tall brown velvet headboard with rounded corners and cream piping.',
    budget:'Buy a plain bed base and have an upholsterer make the headboard: shaped MDF, foam, brown velvet, cream piping. Put the money into the mattress instead of the frame. Price excludes the mattress.'},
  sconces:{zone:'Bedroom',name:'Red and yellow glass sconces',tag:'copy',b:[5e3,12e3,50,120],l:[40e3,100e3,400,1000],
    video:'Two coloured-glass wall lights by the bed: one red, one yellow.',
    budget:'Petal glass sconces are cheap as reproductions. The real cost is the wiring, so mark the points before the walls are plastered.'},
  nightstands:{zone:'Bedroom',name:'Black bedside tables, turned legs',tag:'diy',b:[6e3,14e3,60,140],l:[50e3,90e3,500,900],
    video:'Black bedside tables with turned legs and a wooden drawer front.',
    budget:'Any small second-hand tables with turned legs, painted satin black. Leave the drawer front as wood.'},
  'sideboard-bed':{zone:'Bedroom',name:'Vintage teak sideboard',tag:'hunt',b:[10e3,25e3,150,350],l:[80e3,200e3,800,2000],
    video:'A 1960s-style teak sideboard with sliding doors and a stack of drawers.',
    budget:'Sideboards from the 60s and 70s are common second-hand and cheap. Clean, oil, and replace the feet if needed.'},
  mirror:{zone:'Bedroom',name:'Arched floor mirror',tag:'copy',b:[7e3,15e3,70,150],l:[40e3,80e3,400,800],
    video:'A tall leaning mirror with an organic, asymmetric wooden frame.',
    budget:'Wavy floor mirrors are widely copied. Pick one with a wood frame.'},

/* ---------- State ---------- */
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v==null? d : JSON.parse(v); }catch(e){ return d; } },

};

/* ---------- Money ---------- */
function money(v,cur){
  if(cur==='rub'){
    if(v>=1e6) return (v/1e6).toFixed(v%1e6===0?0:1).replace(/\.0$/,'')+'M';
    return Math.round(v/1000)+'k';

  if(v>=10000) return Math.round(v/1000)+'k';
  return v.toLocaleString('en-GB');
}
function range(arr,cur){
  const i = cur==='rub'?0:2, sym = cur==='rub'?'₽':'£';
  return sym+money(arr[i],cur)+'–'+money(arr[i+1],cur);
}
function sumOf(field,cur,onlyOn){

}

function buildWalls(H){
  wallGroup.children.slice().forEach(c=>{ c.geometry.dispose(); wallGroup.remove(c); });
  for(const w of WALLS){
    const hz = w.z1===w.z2;
    const A = hz? Math.min(w.x1,w.x2):Math.min(w.z1,w.z2), E = hz? Math.max(w.x1,w.x2):Math.max(w.z1,w.z2);
    const segs=[]; let cur=A;
    for(const o of [...w.open].sort((p,q)=>p.a-q.a)){
      if(o.a>cur) segs.push([cur,o.a,0,H]);
      if(o.y0>0) segs.push([o.a,o.b,0,Math.min(o.y0,H)]);
      if(o.y1<H) segs.push([o.a,o.b,o.y1,H]);
      cur=o.b;
    }
    if(cur<E) segs.push([cur,E,0,H]);
    for(const [a,b,y0,y1] of segs){
      if(y1-y0<0.005) continue;
      const len=b-a, mid=(a+b)/2, h=y1-y0;
      const geo = hz? new THREE.BoxGeometry(len,h,w.t) : new THREE.BoxGeometry(w.t,h,len);
      const m=new THREE.Mesh(geo,M.wall); m.position.set(hz?mid:w.x1, y0+h/2, hz?w.z1:mid);
      m.castShadow=m.receiveShadow=true; m.userData.key='walls'; wallGroup.add(m);
      if(H<WALL_H && y1>=H-1e-6){
        const cg = hz? new THREE.BoxGeometry(len,0.012,w.t+0.002) : new THREE.BoxGeometry(w.t+0.002,0.012,len);

      }
    }
  }
}

function setWalls(full){

  labels.forEach(l=>l.visible=!full); labelR.domElement.style.display = full? 'none':'';

const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let tween=null;
function flyTo(pos,target,polar,dur=1000){
  const p0=camera.position.clone(), t0=controls.target.clone(), p1=new THREE.Vector3(...pos), t1=new THREE.Vector3(...target);
  const after=()=>{ controls.maxPolarAngle=polar; };
  if(reduce){ camera.position.copy(p1); controls.target.copy(t1); after(); controls.update(); return; }
  controls.maxPolarAngle=Math.PI;
  tween={p0,t0,p1,t1,start:performance.now(),dur,after};
}
function setFov(f){ camera.fov=f; camera.updateProjectionMatrix(); }
function goView(name){
  const v=VIEWS[name]; currentView=name; setFov(v.full?62:40);
  document.querySelectorAll('#views [data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===name)));
  setWalls(v.full);
  const p=new THREE.Vector3(...v.pos), l=new THREE.Vector3(...v.look);
  const t= v.full? p.clone().add(l.sub(p).normalize().multiplyScalar(1.2)) : l;
  flyTo(v.pos,[t.x,t.y,t.z], v.full? Math.PI*0.8 : Math.PI*0.47);
}
document.querySelectorAll('#views [data-view]').forEach(b=>b.onclick=()=>goView(b.dataset.view));

  if(src!=='list') return;
  const it=APP.ITEMS[key];
  if(it.tall){ goView(ZONE_VIEW[it.zone]||'living'); APP.highlight(key,'scene'); return; }
  if(!gs.length){ return; }
  const box=new THREE.Box3(); (GROUPS[key]||[]).forEach(g=>box.expandByObject(g));
  const c=box.getCenter(new THREE.Vector3()), size=box.getSize(new THREE.Vector3()).length();
  if(it.zone==='Whole flat'){ goView('overview'); return; }
  if(wallsFull){ setWalls(false); document.querySelectorAll('#views [data-view]').forEach(b=>b.setAttribute('aria-pressed','false')); }
  const rc=ROOM_C[it.zone]||[c.x,c.z+2];
  const dir=new THREE.Vector3(rc[0]-c.x,0,rc[1]-c.z); if(dir.length()<0.6) dir.set(0.3,0,1); dir.normalize();
  const dist=Math.max(3.6,size*1.8);
  const pos=c.clone().add(dir.multiplyScalar(dist*0.85)).add(new THREE.Vector3(0,dist*0.7,0));
  setFov(40);
  flyTo([pos.x,pos.y,pos.z],[c.x,c.y,c.z],Math.PI*0.47);
};
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
function keyAt(ev){
  const r=renderer.domElement.getBoundingClientRect(); ptr.set(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ptr,camera);
  const hits=ray.intersectObjects(scene.children,true);
  for(const h of hits){ if(!h.object.visible) continue; let o=h.object, vis=true; while(o){ if(o.visible===false){vis=false;break;} if(o.userData.key) return vis? o.userData.key : null; o=o.parent; } }
  return null;
}
let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY}; if(tween){ tween.after(); tween=null; } });
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down) return; const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y); down=null; if(moved>6) return;
  const k=keyAt(e); APP.select(k,'scene');
});
renderer.domElement.addEventListener('pointermove',e=>{ if(e.pointerType!=='mouse'||down) return; renderer.domElement.style.cursor = keyAt(e)? 'pointer':'grab'; });

/* ---------- theme-aware background ---------- */
function applyBg(){ const c=getComputedStyle(document.documentElement).getPropertyValue('--scene').trim()||'#E2DFD7'; scene.background=new THREE.Color(c); }
applyBg();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyBg);
new MutationObserver(applyBg).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- size + loop ---------- */
function resize(){ const w=stage.clientWidth,h=stage.clientHeight; if(!w||!h) return; renderer.setSize(w,h,false); labelR.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage); resize();

setWalls(false);
const v0=VIEWS.overview; camera.position.set(...v0.pos); controls.target.set(...v0.look); controls.maxPolarAngle=Math.PI*0.47; controls.update();
const ease=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function loop(now){
  if(tween){ const t=Math.min(1,(now-tween.start)/tween.dur), k=ease(t); camera.position.lerpVectors(tween.p0,tween.p1,k); controls.target.lerpVectors(tween.t0,tween.t1,k); if(t>=1){ tween.after(); tween=null; } }
  controls.update(); helpers.forEach(h=>h.update());
  renderer.render(scene,camera); labelR.render(scene,camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
document.getElementById('msg').hidden=true;
if(state.sel) APP.highlight(state.sel,'scene');
</script>
